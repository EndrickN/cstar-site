<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — CSTAR</title>
<link rel="icon" href="assets/logo.png">
<style>
@font-face { font-family:'Geist'; src:url('assets/fonts/Geist-Variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
@font-face { font-family:'Geist Mono'; src:url('assets/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }

:root{
  --bg-deep:#090d16; --bg-panel:#0f172a; --bg-raise:#131c31;
  --border:#1e293b; --border-soft:#18233c;
  --accent:#00b4ff; --green:#84cc16; --warn:#f59e0b; --danger:#f43f5e;
  --text:#f8fafc; --text-2:#94a3b8; --text-3:#64748b;
  --radius:10px;
  --font:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Geist Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  --wrap:1140px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(9,13,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:28px;height:28px;border-radius:7px;border:1px solid var(--border)}
.brand b{font-size:17px;letter-spacing:.4px}
.chip{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;background:var(--border);color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{color:var(--text-2);text-decoration:none;font-size:14px;transition:color .18s}
.nav-links a:hover{color:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:8px;
  font-size:14px;font-weight:700;padding:11px 20px;cursor:pointer;text-decoration:none;transition:all .18s;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#ffffff}
.btn-primary:hover{background:#38c2ff;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text);border-color:#2b3a55}
.btn-ghost:hover{background:rgba(255,255,255,.05);border-color:var(--text-3)}
.btn-sm{padding:8px 15px;font-size:13px}
.btn[data-unset="1"]{opacity:.55;cursor:not-allowed}

/* ---------- hero ---------- */
.hero{padding:76px 0 56px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-320px;left:50%;transform:translateX(-50%);width:1000px;height:640px;
  background:radial-gradient(ellipse at center,rgba(0,180,255,.10),transparent 66%);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);border:1px solid rgba(0,180,255,.28);background:rgba(0,180,255,.07);
  padding:5px 12px;border-radius:999px;margin-bottom:22px}
h1{font-size:clamp(34px,5.2vw,58px);line-height:1.08;letter-spacing:-.022em;font-weight:800;max-width:16ch}
.hero p.lede{margin-top:20px;font-size:clamp(16px,1.7vw,19px);color:var(--text-2);max-width:60ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px;align-items:center}
.cta-note{font-family:var(--mono);font-size:12px;color:var(--text-3)}

/* ---------- app window mock ---------- */
.appwin{margin-top:52px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg-panel);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.03)}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
.appbar-l{display:flex;align-items:center;gap:9px}
.appbar-l img{width:22px;height:22px;border-radius:6px;border:1px solid var(--border)}
.appbar-l b{font-size:13.5px}
.badge-std{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:4px;
  background:rgba(132,204,22,.15);color:var(--green);border:1px solid rgba(132,204,22,.35)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--border);display:block}
.apptabs{display:flex;gap:6px;padding:10px 14px;background:var(--bg-deep);border-bottom:1px solid var(--border);overflow-x:auto}
.apptab{font-size:11.5px;padding:5px 11px;border-radius:6px;border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.apptab.on{background:var(--accent);color:#ffffff;border-color:var(--accent);font-weight:700}
.appbody{background:var(--bg-panel);padding:0}
.appbody img{width:100%}

/* KPI strip inside the mock */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;padding:14px;background:var(--bg-deep);border-bottom:1px solid var(--border)}
.kpi{background:var(--bg-panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.kpi span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:700;display:block;margin-top:5px}
.kpi i{font-family:var(--mono);font-size:10px;color:var(--text-3);font-style:normal}

/* ---------- sections ---------- */
section{padding:74px 0;border-top:1px solid var(--border-soft)}
.sec-head{max-width:62ch;margin-bottom:44px}
.sec-tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.16;letter-spacing:-.018em;font-weight:800}
.sec-head p{margin-top:14px;color:var(--text-2);font-size:16.5px}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em}

/* validation table */
.vtable{width:100%;border-collapse:collapse;font-size:14.5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.vtable th{text-align:left;padding:13px 16px;background:var(--bg-panel);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);font-weight:700;border-bottom:1px solid var(--border)}
.vtable td{padding:14px 16px;border-bottom:1px solid var(--border-soft);color:var(--text-2)}
.vtable tr:last-child td{border-bottom:none}
.vtable td:first-child{color:var(--text);font-weight:600}
.vtable .num{font-family:var(--mono);color:var(--green)}
.scroll-x{overflow-x:auto}

/* feature grid */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:22px}
.fcard{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s,transform .2s}
.fcard:hover{border-color:#2b3a55;transform:translateY(-2px)}
.fcard img{border-bottom:1px solid var(--border);background:var(--bg-panel)}
.fcard-t{padding:20px}
.fcard-t p{margin-top:9px;color:var(--text-2);font-size:14.5px}

/* editions */
.eds{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;align-items:stretch;max-width:880px;margin:0 auto}
.ed{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:28px;position:relative;display:flex;flex-direction:column}
.ed.pro{border-color:rgba(0,180,255,.45);box-shadow:0 0 0 1px rgba(0,180,255,.14),0 18px 50px -22px rgba(0,180,255,.35)}
.ed-name{font-family:var(--mono);font-size:12px;letter-spacing:.08em;font-weight:700}
.ed.demo .ed-name{color:var(--warn)}
.ed.pro .ed-name{color:var(--green)}
.ed-price{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:14px 0 4px}
.ed-price small{font-size:14px;font-weight:600;color:var(--text-3)}
.ed-note{color:var(--text-3);font-size:13.5px;margin-bottom:22px}
.ed ul{list-style:none;margin:22px 0;flex:1}
.ed li{display:flex;gap:11px;padding:7px 0;font-size:14.5px;color:var(--text-2);align-items:flex-start}
.ed li b{color:var(--text);font-weight:600}
.tick{color:var(--green);flex-shrink:0;font-weight:700}
.lock{color:var(--text-3);flex-shrink:0}
.ed .btn{width:100%;margin-top:6px}
.pay-note{margin-top:14px;font-size:12px;color:var(--text-3);line-height:1.5;text-align:center}
.pay-note b{color:var(--text-2);font-weight:600}

/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;counter-reset:s}
.step{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;counter-increment:s;position:relative}
.step::before{content:counter(s);position:absolute;top:20px;right:22px;font-family:var(--mono);font-size:34px;font-weight:800;color:var(--border)}
.step h3{font-size:16.5px;margin-bottom:8px}
.step p{color:var(--text-2);font-size:14.5px}

/* limits / honesty block */
.limits{background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--radius);padding:30px}
.limits ul{list-style:none;margin-top:18px}
.limits li{padding:9px 0 9px 22px;position:relative;color:var(--text-2);font-size:15px;border-bottom:1px solid var(--border-soft)}
.limits li:last-child{border-bottom:none}
.limits li::before{content:"—";position:absolute;left:0;color:var(--warn)}
.limits li b{color:var(--text)}

/* faq */
.faq details{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:11px;background:var(--bg-panel);overflow:hidden}
.faq summary{padding:17px 20px;cursor:pointer;font-weight:600;font-size:15.5px;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--accent);font-size:19px;flex-shrink:0}
.faq details[open] summary::after{content:"−"}
.faq p{padding:0 20px 19px;color:var(--text-2);font-size:14.5px}

/* final cta */
.final{text-align:center;padding:88px 0}
.final h2{max-width:19ch;margin:0 auto}
.final p{max-width:56ch;margin:16px auto 0;color:var(--text-2)}
.final .hero-cta{justify-content:center}

footer{border-top:1px solid var(--border);padding:40px 0;color:var(--text-3);font-size:13.5px}
.foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--text)}
.disclaimer{margin-top:22px;padding-top:22px;border-top:1px solid var(--border-soft);max-width:80ch;line-height:1.65}

@media(max-width:820px){
  .nav-links{display:none}
  .hero{padding:52px 0 36px}
  section{padding:56px 0}
}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-in">
  <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><b>CSTAR</b><span class="chip">v1.0</span></a>
</div></nav>
<header class="hero" style="text-align:center">
  <div class="wrap">
    <div class="eyebrow">Error 404</div>
    <h1 style="max-width:none;margin:0 auto">This page does not exist.</h1>
    <p class="lede" style="margin-left:auto;margin-right:auto">
      The link may be out of date. Everything about CSTAR lives on one page.
    </p>
    <div class="hero-cta" style="justify-content:center">
      <a class="btn btn-primary" href="index.html">Back to CSTAR</a>
    </div>
  </div>
</header>
</body>
</html>
